<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script defer src="script.js"></script>
</head>
<body>
    <div>
        <button id="rock" class="btn-choice">ROCK</button>
        <button id="paper" class="btn-choice">PAPER</button>
        <button id="scissors" class="btn-choice">SCISSORS</button>
    </div>
    <div>
        <p>Human: <span id="h-choice"></span> versus Computer: <span id="c-choice"></span></p>
        <p>Human Score: <span id="h-score"></span> || Computer Score: <span id="c-score"></span></p>
        <p>End of round: <span id="message"></span></p>
        <p>Final result: <span id="final-result"></span></p>
    </div>
</body>
</html>
